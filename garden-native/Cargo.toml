[package]
name = "garden-native"
version = "0.1.0"
edition = "2021"
authors = ["ihomy"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
garden-core = { path = "../garden-core" }
napi = { version = "2.0", default-features = false, features = ["napi8"] }
napi-build = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.0"

[profile.release]
opt-level = "s"
lto = true
