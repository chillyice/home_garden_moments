[package]
name = "garden-wasm"
version = "0.1.0"
edition = "2021"
authors = ["ihomy"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
garden-core = { path = "../garden-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
opt-level = "s"  # Optimize for small binary size
lto = true
